<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Centrifuge — Newsletter Curator</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Centrifuge — a curated reading view of your newsletters." />


    <!-- Set the theme class before paint to avoid a flash. -->
    <script>
      try {
        const stored = localStorage.getItem('centrifuge:dark')
        const dark = stored === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : stored === 'true'
        if (dark) document.documentElement.classList.add('dark')
      } catch (_) {}
    </script>
  </head>
  <body class="text-ink-800 dark:text-ink-100">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
